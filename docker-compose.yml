services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus}
      POSTGRES_DB: ${POSTGRES_DB:-nexus}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexus}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    env_file: .env
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    # Explicit even though it matches the image's own HEALTHCHECK - the
    # worker service below overrides this same baked-in check with a
    # Celery-appropriate one, since neither serves an HTTP port. Repeating
    # it here for backend makes the override intentional and visible in one
    # place rather than "only worker's differs, for unstated reasons".
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  worker:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    # --concurrency=1: see app/workers/celery_app.py's worker_process_init
    # handler - a single worker process keeps its in-memory Prometheus
    # registry complete, whereas Celery's default multi-process prefork pool
    # would silently split celery_*/document_processing_* counts across
    # processes with no metrics server for the ones this container's own
    # start_http_server() doesn't happen to be running in. An accepted
    # concurrency-vs-metrics-correctness tradeoff for this project's scale -
    # see docs/observability.md.
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=1
    env_file: .env
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    expose:
      - "9808"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    # Overrides the runtime image's baked-in HTTP HEALTHCHECK (backend/Dockerfile) -
    # the worker doesn't serve port 8000, so that check would always fail
    # ("unhealthy") regardless of whether Celery itself is fine. `inspect
    # ping` round-trips through the real broker to the worker process and
    # back, which is what "the worker is actually alive and consuming
    # tasks" means for Celery - not just "the container process exists".
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # --- Observability stack (Phase 8) ---
  # Opt-in via `docker compose --profile observability up` - the core
  # platform (postgres/redis/minio/backend/worker/frontend, above) never
  # depends on any of these three, and OTEL_ENABLED/PROMETHEUS_ENABLED
  # failing open means `docker compose up` (no profile) runs Nexus exactly
  # as before Phase 8. See docs/observability.md "Local startup".
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    profiles: ["observability"]
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    profiles: ["observability"]
    environment:
      # Local-dev-only default credential, same posture as MinIO's
      # minioadmin/minioadmin - never used outside this Compose file, and
      # documented as such in docs/observability.md and docs/security.md.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    restart: unless-stopped
    profiles: ["observability"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # Jaeger UI
      - "4317:4317" # OTLP/gRPC - what OTEL_EXPORTER_OTLP_ENDPOINT points at
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:16686 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  minio_data:
  prometheus_data:
  grafana_data:
