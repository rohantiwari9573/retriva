# Production deployment compose file (Phase 11).
#
# This is a STANDALONE file, not an override merged with docker-compose.yml -
# ports and volumes differ enough (no host-published DB/Redis, no source
# bind-mounts, an added nginx reverse proxy) that a merge-based override risks
# silently keeping a dev setting Compose's list-merge semantics don't cleanly
# let you unset. Local development is untouched: `docker compose up` (using
# docker-compose.yml alone) still works exactly as it did before Phase 11.
#
# Usage on the deployment host:
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml run --rm backend alembic upgrade head
#   docker compose -f docker-compose.prod.yml up -d
#
# See docs/aws-deployment.md for the full deployment sequence, cost notes,
# and cleanup procedure.

networks:
  # A fixed subnet exists for exactly one reason: pinning nginx to a known
  # IP (172.28.0.10 below) so the backend can trust its X-Real-IP header
  # for rate limiting (TRUSTED_PROXY_IPS) without trusting arbitrary
  # traffic - see app/core/rate_limit.py's module docstring. Every other
  # service gets a Docker-assigned address within this same subnet; only
  # nginx's needs to be predictable.
  retriva_net:
    ipam:
      config:
        - subnet: 172.28.0.0/16

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus}
      POSTGRES_DB: ${POSTGRES_DB:-nexus}
    # No host port published - reachable only from other containers on this
    # compose network. Never exposed to the public internet (Phase 11 spec's
    # explicit networking requirement).
    networks:
      - retriva_net
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexus}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # No host port published - internal only, same reasoning as postgres.
    networks:
      - retriva_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    # No host port published - presigned URLs are reachable through the
    # nginx /storage/ proxy over HTTPS instead (see infra/nginx/nginx.conf),
    # not by exposing MinIO's port directly. 9001 (web console/admin UI) is
    # never exposed at all, by host or by proxy.
    networks:
      - retriva_net
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    env_file: .env
    networks:
      - retriva_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # No source bind-mount - runs the image built from the committed
    # source, not whatever happens to be on the host filesystem.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  worker:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=1
    env_file: .env
    networks:
      - retriva_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  frontend:
    # Explicit image tag (not just Compose's default <project>-frontend
    # inference) so `docker load`-ing a tarball built on the GitHub Actions
    # runner - see the `deploy` job in .github/workflows/ci.yml - lands on
    # exactly the tag `docker compose up` will look for, with no build
    # needed on this instance at all. The frontend's `next build` is the
    # one step in this whole stack memory-hungry enough to have OOM'd this
    # 2 GiB instance twice (see docs/aws-deployment.md "Compute
    # configuration") - moving it to the runner, which has far more RAM,
    # removes that risk entirely rather than working around it in place.
    # `build:` is kept so a manual on-box build still works if ever needed
    # (e.g. `docker compose -f docker-compose.prod.yml build frontend`),
    # it's simply not what the normal deploy path calls anymore.
    image: retriva-frontend:latest
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    env_file: .env
    networks:
      - retriva_net
    # No host port published - only reachable through the nginx proxy below.

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    networks:
      retriva_net:
        # Pinned so the backend can name this exact address in
        # TRUSTED_PROXY_IPS - see the `networks:` block comment above.
        ipv4_address: 172.28.0.10
    ports:
      - "80:80"
      - "443:443"
      - "9443:9443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Let's Encrypt cert, managed on the host by certbot (not by this
      # compose file) - see docs/aws-deployment.md "HTTPS status" for the
      # automated renewal design (infra/systemd/retriva-certbot-renew.{service,timer}).
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # ACME HTTP-01 challenge webroot, shared read-only with the host
      # process running certbot - not writable from inside the container,
      # since nginx only ever needs to serve files certbot already wrote.
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  minio_data:
