name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Type check (mypy)
        run: mypy app

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://nexus:nexus@localhost:5432/nexus_test
          REDIS_URL: redis://localhost:6379/15
          JWT_SECRET: ci-test-secret-not-for-production-use-only
        run: pytest --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t nexus-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t nexus-frontend:ci ./frontend

  # Phase 11: deploy only after backend/frontend/docker-build all pass, and
  # only on an actual push to master (never on a PR) - see
  # docs/aws-deployment.md "Rollback procedure" for what to do if a bad
  # deploy makes it through anyway. Auth is a plain SSH key stored as a
  # GitHub secret, not OIDC+IAM - the AWS account's IAM user this project
  # shares with two other projects had no permission to create IAM roles,
  # and broadening that on a shared credential was judged riskier than an
  # SSH key scoped to only this one EC2 instance. See docs/aws-deployment.md
  # "GitHub Actions authentication" for the full reasoning.
  deploy:
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker-build]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.RETRIVA_DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.RETRIVA_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync source to EC2
        # rsync from the runner's own checkout, not a git pull on the box -
        # the box deliberately has no credentials for this private repo (see
        # docs/aws-deployment.md "GitHub Actions authentication"), so the
        # runner (which already has the checked-out code) pushes it over
        # instead of the box pulling it.
        run: |
          # --delete removes files on the box that no longer exist in this
          # checkout - but .env and frontend/.env.local are real secrets
          # that live ONLY on the box (gitignored, never in this checkout),
          # so they are explicitly excluded from deletion as well as from
          # being overwritten by a (nonexistent) source copy.
          rsync -az --delete \
            --exclude='.git' --exclude='node_modules' --exclude='.next' \
            --exclude='__pycache__' --exclude='.pytest_cache' --exclude='.ruff_cache' --exclude='.mypy_cache' \
            --exclude='.env' --exclude='frontend/.env.local' \
            --filter='P .env' --filter='P frontend/.env.local' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./ ec2-user@${{ secrets.RETRIVA_HOST }}:/home/ec2-user/retriva/

      - name: Build frontend image on the runner (not on EC2)
        # This runner has far more RAM than the 2 GiB EC2 instance, and
        # `next build`'s webpack step is the one thing in this whole stack
        # memory-hungry enough to have OOM'd that instance twice (see
        # docs/aws-deployment.md "Compute configuration") - building here
        # instead of on the box removes the risk entirely rather than
        # working around it with a stop-other-containers-first script on
        # every deploy. No ECR involved: the built image is saved to a
        # plain tarball and shipped over the same SSH channel everything
        # else already uses, avoiding a registry's cost/IAM surface for a
        # single-instance deployment.
        run: |
          docker build -t retriva-frontend:latest \
            --build-arg NEXT_PUBLIC_API_URL="${{ vars.RETRIVA_PUBLIC_URL }}" \
            ./frontend
          docker save retriva-frontend:latest | gzip > /tmp/retriva-frontend.tar.gz
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            /tmp/retriva-frontend.tar.gz ec2-user@${{ secrets.RETRIVA_HOST }}:/tmp/retriva-frontend.tar.gz

      - name: Build, migrate, deploy on EC2
        run: |
          ssh -i ~/.ssh/deploy_key ec2-user@${{ secrets.RETRIVA_HOST }} '
            set -e
            docker load < /tmp/retriva-frontend.tar.gz
            rm -f /tmp/retriva-frontend.tar.gz
            cd /home/ec2-user/retriva
            docker compose -f docker-compose.prod.yml build backend worker
            docker compose -f docker-compose.prod.yml run --rm backend alembic upgrade head
            docker compose -f docker-compose.prod.yml up -d
            sleep 5
            curl -fsSk https://localhost/health
          '
