name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Type check (mypy)
        run: mypy app

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://nexus:nexus@localhost:5432/nexus_test
          REDIS_URL: redis://localhost:6379/15
          JWT_SECRET: ci-test-secret-not-for-production-use-only
        run: pytest --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # After the build, which generates the route types tsc needs.
      - name: Type check
        run: npx tsc --noEmit

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t nexus-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t nexus-frontend:ci ./frontend

  # Proves the README quickstart: an empty database reaches a working API
  # through `docker compose` alone, with no manual migration step.
  fresh-start:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4

      - name: Create local environment file
        run: cp .env.example .env

      - name: Pull the object storage image from a clean machine
        run: |
          docker image ls --digests | grep -i minio && exit 1 || echo "No MinIO image cached"
          docker compose pull minio
          docker image ls --digests | grep -i minio

      - name: Start the stack on empty volumes
        run: >-
          docker compose -f docker-compose.yml -f docker-compose.isolated.yml
          up -d --wait --wait-timeout 300 --build backend worker stub-ai

      - name: Smoke test
        run: >-
          docker compose -f docker-compose.yml -f docker-compose.isolated.yml
          exec -T backend python -m scripts.smoke_test --base-url http://localhost:8000

      - name: Confirm migration, API and worker state
        run: |
          compose="docker compose -f docker-compose.yml -f docker-compose.isolated.yml"
          $compose ps --all
          test "$($compose ps --all --format '{{.ExitCode}}' migrate)" = "0"
          for service in backend worker minio; do
            container="$($compose ps -q "$service")"
            test "$(docker inspect -f '{{.State.Health.Status}}' "$container")" = "healthy"
          done

      - name: Show logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.isolated.yml logs --tail 100
