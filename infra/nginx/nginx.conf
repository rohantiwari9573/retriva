worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Real TLS via Let's Encrypt against 16-176-132-2.sslip.io (free
    # wildcard DNS for the instance's public IP - no domain was purchased).
    # This exists because backend/app/main.py's _check_production_config()
    # hard-refuses to boot with ENVIRONMENT=production and
    # COOKIE_SECURE=false - see docs/aws-deployment.md "HTTPS status" for
    # the full story of why this was added mid-deployment rather than
    # shipping HTTP-only as originally planned.

    upstream retriva_backend {
        server backend:8000;
    }

    upstream retriva_frontend {
        server frontend:3000;
    }

    upstream retriva_storage {
        server minio:9000;
    }

    server {
        listen 80;
        server_name _;

        # Let's Encrypt HTTP-01 challenge (webroot method) - certbot writes
        # the challenge file to this path on the host, mounted read-only
        # here, and Let's Encrypt's validator fetches it over plain HTTP
        # before the 301 below would otherwise apply. This must be matched
        # BEFORE the catch-all redirect, or every challenge request would
        # bounce to HTTPS and fail. See docs/aws-deployment.md "HTTPS
        # status" and infra/systemd/retriva-certbot-renew.service.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name 16-176-132-2.sslip.io;

        ssl_certificate     /etc/letsencrypt/live/16-176-132-2.sslip.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/16-176-132-2.sslip.io/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Backend API - everything under the app's real prefix, plus the
        # top-level health endpoints (see backend/app/main.py, which mounts
        # health_router with no prefix and api_router under API_V1_PREFIX).
        # Deliberately NOT proxying /metrics here - see docs/aws-deployment.md
        # "Observability" for why the metrics endpoint stays unreachable from
        # the public internet in this deployment, unlike /health.
        location /api/ {
            proxy_pass http://retriva_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # The chat/streaming endpoint (Server-Sent Events) needs the
            # response to reach the client incrementally, not buffered until
            # complete - buffering here would turn a stream into one
            # delayed lump, defeating the point of SSE in production. See
            # docs/aws-deployment.md's "Frontend" section for the live
            # verification this specifically required.
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            chunked_transfer_encoding off;
        }

        location ~ ^/(health|liveness|readiness)$ {
            proxy_pass http://retriva_backend;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://retriva_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Presigned MinIO download/upload URLs get their own TLS port, proxied
    # to MinIO with NO path rewriting - a path-based location (e.g.
    # /storage/<bucket>/<key>) was tried first and rejected: AWS SigV4
    # signs the full request path, so boto3 signs
    # "/storage/<bucket>/<key>" (since S3_PUBLIC_ENDPOINT_URL included
    # /storage), but MinIO only ever sees the path it actually receives -
    # stripping /storage before forwarding made that path no longer match
    # what was signed, and MinIO correctly rejected it as
    # SignatureDoesNotMatch (confirmed live during Phase 11 smoke testing).
    # A dedicated port with a 1:1 path pass-through keeps the signed path
    # and the forwarded path identical. See docs/aws-deployment.md "Object
    # storage configuration".
    server {
        listen 9443 ssl;
        server_name 16-176-132-2.sslip.io;

        ssl_certificate     /etc/letsencrypt/live/16-176-132-2.sslip.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/16-176-132-2.sslip.io/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://retriva_storage;
            proxy_http_version 1.1;
            # $http_host, not $host - nginx's $host always strips the port,
            # but boto3 signed the presigned URL's Host header AS
            # "16-176-132-2.sslip.io:9443" (the non-default port is part of
            # S3_PUBLIC_ENDPOINT_URL). Host is a SigV4-signed header, so
            # forwarding a port-stripped Host to MinIO broke signature
            # validation (SignatureDoesNotMatch, confirmed live) even after
            # the path-rewrite issue above was fixed. $http_host preserves
            # the client's original Host header, port included, unchanged.
            proxy_set_header Host $http_host;
        }
    }
}
